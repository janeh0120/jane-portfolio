# Disabled: production is on Vercel (@astrojs/vercel).
# This workflow kept failing after the Vercel adapter change because
# `dist/` is no longer a GitHub Pages–ready static root, and janehou.ca
# is served by Vercel — not GitHub Pages.
#
# Keeping the file for reference. Do not re-enable unless you switch back
# to a static adapter and point the domain at GitHub Pages again.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type enable-pages to run (disabled by default)'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.confirm == 'enable-pages' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          # Vercel adapter emits static assets here, not under dist/
          path: .vercel/output/static

  deploy:
    if: ${{ inputs.confirm == 'enable-pages' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
